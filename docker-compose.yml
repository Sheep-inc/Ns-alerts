services:
  ns-alerts:
    build: .
    container_name: ns-alerts
    restart: unless-stopped
    env_file: .env
    environment:
      NPM_CONFIG_CACHE: /tmp/npm
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    ports:
      - "8780:8780"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "node"
    volumes:
      - ./data:/app/data
      - ./seed:/app/seed:ro
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:8780/healthz',{signal:AbortSignal.timeout(4000)}); if(!r.ok) process.exit(1)"]
      interval: 60s
      timeout: 5s
      retries: 3
