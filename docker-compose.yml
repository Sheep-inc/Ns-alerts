services:
  ns-alerts:
    build: .
    container_name: ns-alerts
    restart: unless-stopped
    env_file: .env
    ports:
      - "8780:8780"
    volumes:
      - ./data:/app/data
      - ./seed:/app/seed:ro
    healthcheck:
      # /api/status (met basic auth als UI_PASSWORD gezet is)
      test: ["CMD", "node", "--input-type=module", "-e", "const h={}; if(process.env.UI_PASSWORD) h.Authorization='Basic '+Buffer.from('x:'+process.env.UI_PASSWORD).toString('base64'); const r=await fetch('http://127.0.0.1:8780/api/status',{headers:h,signal:AbortSignal.timeout(4000)}); if(!r.ok) process.exit(1)"]
      interval: 60s
      timeout: 5s
      retries: 3
