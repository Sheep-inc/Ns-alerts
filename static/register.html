<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registreren — NS treinalerts</title><link rel="stylesheet" href="/app.css"></head><body>
<header>🚆 NS treinalerts</header><main>
<div class="card"><b>Registreren</b>
<form id="f">
<label>Uitnodigingscode</label><input id="invite" autocomplete="off" required>
<label>Gebruikersnaam</label><input id="user" autocomplete="username" required>
<label>Wachtwoord (minimaal 8 tekens)</label><input id="pass" type="password" autocomplete="new-password" required>
<button type="submit">Account maken</button>
</form>
<p id="err" class="warn"></p>
<p><a href="/login">Terug naar inloggen</a></p>
</div>
</main><script src="/client.js"></script><script src="/register.js"></script></body></html>
